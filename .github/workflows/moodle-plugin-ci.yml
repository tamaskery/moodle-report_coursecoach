name: Moodle Plugin CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Moodle ${{ matrix.moodle-branch }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U moodle -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_405_STABLE
            php-version: '8.2'
            database: mariadb
            db-host: 127.0.0.1
            db-port: 3306
            db-user: root
            db-pass: ''
          - moodle-branch: MOODLE_500_STABLE
            php-version: '8.3'
            database: mariadb
            db-host: 127.0.0.1
            db-port: 3306
            db-user: root
            db-pass: ''
          - moodle-branch: MOODLE_501_STABLE
            php-version: '8.3'
            database: mariadb
            db-host: 127.0.0.1
            db-port: 3306
            db-user: root
            db-pass: ''
          - moodle-branch: MOODLE_502_STABLE
            php-version: '8.3'
            database: mariadb
            db-host: 127.0.0.1
            db-port: 3306
            db-user: root
            db-pass: ''
          - moodle-branch: MOODLE_502_STABLE
            php-version: '8.3'
            database: pgsql
            db-host: 127.0.0.1
            db-port: 5432
            db-user: moodle
            db-pass: moodle
          - moodle-branch: MOODLE_503_STABLE
            php-version: '8.3'
            database: mariadb
            db-host: 127.0.0.1
            db-port: 3306
            db-user: root
            db-pass: ''
          - moodle-branch: MOODLE_503_STABLE
            php-version: '8.4'
            database: pgsql
            db-host: 127.0.0.1
            db-port: 5432
            db-user: moodle
            db-pass: moodle
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pgsql
          ini-values: max_input_vars=5000
          coverage: none
      - name: Set up Moodle PHPUnit locale
        run: |
          sudo locale-gen en_AU.UTF-8
          locale -a | grep -Eqi '^en_AU\.utf-?8$'
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        run: >-
          moodle-plugin-ci install --plugin ./plugin
          --db-host=${{ matrix.db-host }} --db-port=${{ matrix.db-port }}
        env:
          DB: ${{ matrix.database }}
          DB_USER: ${{ matrix.db-user }}
          DB_PASS: ${{ matrix.db-pass }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - name: PHP lint
        run: moodle-plugin-ci phplint
      - name: Moodle coding standards
        run: moodle-plugin-ci phpcs
      - name: Moodle PHPDoc validation
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Plugin validation
        run: moodle-plugin-ci validate
      - name: Upgrade savepoint validation
        run: moodle-plugin-ci savepoints
      - name: Mustache lint
        run: moodle-plugin-ci mustache
      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd
      - name: PHPUnit
        run: moodle-plugin-ci phpunit
      - name: Moodle 5.2 to 5.3 upgrade smoke test
        if: matrix.moodle-branch == 'MOODLE_503_STABLE' && matrix.database == 'mariadb'
        run: |
          cd moodle
          git fetch --depth=1 origin MOODLE_502_STABLE
          git checkout --detach FETCH_HEAD
          composer install --no-interaction --prefer-dist
          # Install the exact audited plugin before exercising a real plugin upgrade.
          reportpath=public/report/coursecoach
          if test -L "$reportpath"; then
            unlink "$reportpath"
          else
            mv "$reportpath" ../coursecoach-ci-installed
          fi
          mkdir -p "$reportpath"
          git -C ../plugin archive 8a7eec02ce932e34b37011599f4601991c8b4dd2 | tar -xf - -C "$reportpath"
          php admin/cli/install_database.php --agree-license --adminpass='Upgrade-test-only-123!' --adminemail=admin@example.invalid --fullname='Upgrade test' --shortname=upgrade
          php ../plugin/.github/scripts/plugin-upgrade-smoke.php prepare
          rsync -a --delete --exclude=.git --exclude=.github ../plugin/ "$reportpath/"
          php admin/cli/upgrade.php --non-interactive
          php ../plugin/.github/scripts/plugin-upgrade-smoke.php verify
          php ../plugin/.github/scripts/upgrade-smoke.php prepare
          git fetch --depth=1 origin MOODLE_503_STABLE
          git checkout --detach FETCH_HEAD
          composer install --no-interaction --prefer-dist
          php admin/cli/upgrade.php --non-interactive
          php ../plugin/.github/scripts/upgrade-smoke.php verify

  behat:
    name: Behat smoke tests / ${{ matrix.moodle-branch }} / MariaDB
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_405_STABLE
            php-version: '8.2'
            tags: '@report_coursecoach&&~@report_coursecoach_53'
          - moodle-branch: MOODLE_502_STABLE
            php-version: '8.3'
            tags: '@report_coursecoach&&~@report_coursecoach_53'
          - moodle-branch: MOODLE_503_STABLE
            php-version: '8.3'
            tags: '@report_coursecoach'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          ini-values: max_input_vars=5000
          coverage: none
      - name: Set up Moodle Behat locale
        run: |
          sudo locale-gen en_AU.UTF-8
          locale -a | grep -Eqi '^en_AU\.utf-?8$'
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 --db-port=3306
        env:
          DB: mariadb
          DB_USER: root
          DB_PASS: ''
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - name: Run Course Readiness Coach Behat smoke tests
        env:
          COURSECOACH_SCREENSHOT_DIR: ${{ github.workspace }}/coursecoach-screenshots
        run: >-
          moodle-plugin-ci behat --profile chrome
          --tags="${{ matrix.tags }}" --auto-rerun 0 --dump
      - name: Save Moodle 5.3 report screenshots
        if: always() && matrix.moodle-branch == 'MOODLE_503_STABLE'
        uses: actions/upload-artifact@v4
        with:
          name: moodle-5.3-report-screenshots
          path: coursecoach-screenshots/*.png
          if-no-files-found: error

  package-layout:
    name: Installable package layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify the Moodle plugin archive layout
        run: |
          mkdir -p build/coursecoach
          git archive --format=tar HEAD | tar -xf - -C build/coursecoach
          test -f build/coursecoach/version.php
          grep -q "\$plugin->component = 'report_coursecoach';" build/coursecoach/version.php
          (cd build && zip -qr coursecoach.zip coursecoach)
          entries="$(unzip -Z1 build/coursecoach.zip)"
          test "$(printf '%s\n' "$entries" | awk -F/ 'NF {print $1}' | sort -u | wc -l)" -eq 1
          printf '%s\n' "$entries" | grep -qx 'coursecoach/version.php'
          ! printf '%s\n' "$entries" | grep -Eq '^coursecoach/(\.git|\.github|AGENTS\.md)(/|$)'
          ! printf '%s\n' "$entries" | grep -Eqi '^coursecoach/([^/]+/)*(\.env(\.[^/]*)?|\.DS_Store|Thumbs\.db|.*\.(key|pem|zip|tmp|swp)|(credentials?|secrets?)([._-].*)?|\.vscode|\.idea|build)(/|$)'
